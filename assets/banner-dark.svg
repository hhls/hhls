<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="344" viewBox="0 0 1280 344" role="img" aria-labelledby="title desc">
<title id="title">Halen — Make useful things. Keep life simple.</title>
<desc id="desc">Personal profile banner for hhls. Interests: networking, automation, and Python.</desc>
<defs>
