  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b1a4ff"/><stop offset="1" stop-color="#82d9cf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#293550" stroke-width="1"/></pattern>
  <clipPath id="clip"><rect width="1280" height="344" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
