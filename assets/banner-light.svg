  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6254c7"/><stop offset="1" stop-color="#177e7e"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dce2f2" stroke-width="1"/></pattern>
  <clipPath id="clip"><rect width="1280" height="344" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
